# Custom POS vhost; keep this filename without the auto. prefix.
<VirtualHost *:80>
    ServerName pos.test
    DocumentRoot "C:/laragon/www/pos/public"
    Redirect permanent / https://pos.test/
</VirtualHost>

<VirtualHost *:443>
    ServerName pos.test
    DocumentRoot "C:/laragon/www/pos/public"

    <Directory "C:/laragon/www/pos/public">
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile "C:/laragon/etc/ssl/laragon.crt"
    SSLCertificateKeyFile "C:/laragon/etc/ssl/laragon.key"
    SSLProtocol -all +TLSv1.2 +TLSv1.3
</VirtualHost>
