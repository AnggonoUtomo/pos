    <rect x="1285" y="220" width="230" height="150" rx="20" fill="#382b24" stroke="#e9ad64" stroke-width="3"/>
    <text x="1310" y="263" fill="#ffd38c" font-size="23" font-weight="bold">05 · APPROVAL</text><text x="1310" y="298" fill="#fff3df" font-size="20">Wajib Ino</text><text x="1310" y="328" fill="#f1cba6" font-size="16">STOP sebelum izin</text>
    <path d="M345 295H380 M645 295H680 M945 295H980 M1245 295H1280" fill="none" stroke="#78a8cc" stroke-width="4" marker-end="url(#arr)"/>
