  <text x="115" y="782" fill="#f1e8fa" font-size="22" font-family="Arial, sans-serif">Tanpa APPROVAL → tidak ada coding, migrasi, instalasi, commit, push, atau perubahan modul existing.</text>
  <text x="1515" y="866" text-anchor="end" fill="#7896ad" font-family="Arial, sans-serif" font-size="15">PIMS-style • v1.0 • 16:9</text>
