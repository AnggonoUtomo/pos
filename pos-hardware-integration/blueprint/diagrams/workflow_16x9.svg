    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#192d46"/><stop offset="1" stop-color="#14233a"/></linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#78a8cc"/></marker>
  </defs>
