    <text x="1040" y="594" fill="#b7eadb" font-size="17">Hanya file dan lingkup yang disetujui</text>
    <rect x="490" y="480" width="475" height="145" rx="20" fill="url(#card)" stroke="#4279a4" stroke-width="2"/>
