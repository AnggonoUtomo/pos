    <text x="115" y="594" fill="#a9c4d8" font-size="17">SESSION_HANDOFF · TASK_INDEX</text>
    <path d="M1005 552H971 M485 552H451" fill="none" stroke="#78a8cc" stroke-width="4" marker-end="url(#arr)"/>
