    <rect x="385" y="220" width="260" height="150" rx="20" fill="url(#card)" stroke="#4279a4" stroke-width="2"/>
    <text x="415" y="263" fill="#76d8fd" font-size="23" font-weight="bold">02 · Discovery</text><text x="415" y="298" fill="#eef5ff" font-size="20">Audit read-only</text><text x="415" y="328" fill="#a9c4d8" font-size="16">kontrak existing</text>
    <rect x="685" y="220" width="260" height="150" rx="20" fill="url(#card)" stroke="#4279a4" stroke-width="2"/>
